<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MIXXIN — Typeform 名單匯出</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   MIXXIN Design System v2 — Tokens
   ============================================================ */
:root {
  /* Brand — Gold */
  --gold-50:  #fffbeb;
  --gold-100: #fef3c7;
  --gold-200: #fde68a;
  --gold-300: #fcd34d;
  --gold-400: #fbbf24;
  --gold-500: #ffb81c;
  --gold-600: #d97706;
  --gold-700: #b45309;
  /* Brand — Navy */
  --navy-100: #d9e2ec;
  --navy-700: #334e68;
  --navy-800: #0c2340;
  --navy-900: #081829;
  /* Complementary — Teal */
  --teal-50:  #f0fdfa;
  --teal-100: #ccfbf1;
  --teal-200: #99f6e4;
  --teal-500: #14b8a6;
  --teal-600: #0d9488;
  --teal-700: #0f766e;
  /* Neutral — Slate */
  --slate-50:  #f8fafc;
  --slate-100: #f1f5f9;
  --slate-200: #e2e8f0;
  --slate-300: #cbd5e1;
  --slate-400: #94a3b8;
  --slate-500: #64748b;
  --slate-600: #475569;
  --slate-800: #1e293b;

  /* Semantic */
  --bg-base:        var(--slate-50);
  --bg-surface:     #ffffff;
  --bg-muted:       var(--slate-100);
  --text-primary:   var(--slate-800);
  --text-secondary: var(--slate-500);
  --text-tertiary:  var(--slate-400);
  --border-default: var(--slate-200);
  --border-strong:  var(--slate-300);

  --success:       #10b981;
  --success-light: #d1fae5;
  --success-fg:    #065f46;
  --warning:       #f59e0b;
  --warning-light: #fef3c7;
  --warning-fg:    #92400e;
  --error:         #ef4444;
  --error-light:   #fee2e2;
  --error-fg:      #991b1b;
  --info-fg:       #1e40af;

  --gradient-gold-soft: linear-gradient(135deg, #ffb81c 0%, #fcd34d 100%);
  --gradient-navy-deep: linear-gradient(135deg, #1e293b 0%, #334155 100%);

  --shadow-raised:   4px 4px 10px rgba(0,0,0,0.06), -4px -4px 10px rgba(255,255,255,0.8);
  --shadow-pressed:  inset 3px 3px 6px rgba(0,0,0,0.06), inset -3px -3px 6px rgba(255,255,255,0.8);
  --shadow-floating: 8px 8px 20px rgba(0,0,0,0.08), -8px -8px 20px rgba(255,255,255,0.9);
  --shadow-sm:       0 1px 2px rgba(0,0,0,0.05);

  --radius-sm:   4px;
  --radius-md:   8px;
  --radius-lg:   12px;
  --radius-xl:   16px;
  --radius-full: 9999px;

  --font: 'Rubik', 'Noto Sans TC', sans-serif;
  --mono: 'SFMono-Regular', Menlo, Consolas, monospace;
  --transition-fast: 150ms ease;
  --transition-normal: 250ms ease;

  /* 相容舊程式碼（JS 字串內仍引用） */
  --muted: var(--text-secondary);
  --brand: var(--gold-700);
  --border: var(--border-default);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; }
body {
  min-height: 100vh;
  background: var(--bg-base);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.6;
  color: var(--text-primary);
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
}

/* ── Header ── */
header {
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-default);
  height: 64px;
  padding: 0 40px;
  display: flex; align-items: center; justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
.brand-symbol { height: 36px; width: auto; display: block; }
.brand-wordmark { height: 18px; width: auto; display: block; }
.brand-divider { width: 1px; height: 22px; background: var(--border-default); margin: 0 2px; }
.brand-product {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  letter-spacing: 0.02em;
  white-space: nowrap;
}
.header-badge {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--bg-muted);
  padding: 4px 10px;
  border-radius: var(--radius-full);
  white-space: nowrap;
}

/* ── Main ── */
main {
  flex: 1;
  max-width: 760px;
  width: 100%;
  margin: 0 auto;
  padding: 32px 24px 64px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* ── Page title ── */
.page-title { padding: 4px 0 8px; }
.page-title .eyebrow {
  font-size: 11px;
  font-weight: 600;
  color: var(--gold-700);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.page-title h1 {
  font-size: 28px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--text-primary);
  line-height: 1.3;
}
.page-title p {
  font-size: 14px;
  color: var(--text-secondary);
  margin-top: 6px;
}

/* ── Card ── */
.card {
  background: var(--bg-surface);
  border-radius: var(--radius-xl);
  padding: 24px;
  border: 1px solid var(--border-default);
  box-shadow: var(--shadow-raised);
}
.card-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px;
}
.card-title .optional {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--bg-muted);
  padding: 2px 8px;
  border-radius: var(--radius-full);
}

/* ── Field label / helpers ── */
.field-label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-primary);
  margin-bottom: 8px;
}
.field-row {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 8px;
}
.field-row .field-label { margin-bottom: 0; }
.link-btn {
  font-family: var(--font);
  font-size: 12px;
  font-weight: 500;
  color: var(--gold-700);
  background: none; border: none; cursor: pointer; padding: 4px 8px;
  border-radius: var(--radius-sm);
  transition: all var(--transition-fast);
}
.link-btn:hover { background: var(--gold-50); }
.divider { height: 1px; background: var(--border-default); margin: 20px 0; }
.form-list { display: flex; flex-direction: column; gap: 6px; max-height: 280px; overflow-y: auto; padding-right: 2px; }
.form-list::-webkit-scrollbar { width: 6px; }
.form-list::-webkit-scrollbar-thumb { background: var(--slate-200); border-radius: 3px; }
.form-list-loading { font-size: 12px; color: var(--text-tertiary); padding: 12px 0; text-align: center; }

/* ── Input ── */
.input-wrap { display: flex; gap: 10px; }
input[type="text"], input[type="password"] {
  flex: 1;
  min-width: 0;
  height: 44px;
  background: var(--bg-base);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-md);
  color: var(--text-primary);
  font-family: var(--font);
  font-size: 14px;
  padding: 0 16px;
  outline: none;
  box-shadow: var(--shadow-pressed);
  transition: all var(--transition-fast);
}
input[type="text"]:focus, input[type="password"]:focus {
  border-color: var(--gold-400);
  box-shadow: var(--shadow-pressed), 0 0 0 3px rgba(251,191,36,0.15);
}
input::placeholder { color: var(--text-tertiary); }

/* ── Buttons ── */
.btn-primary {
  font-family: var(--font);
  font-weight: 600;
  font-size: 14px;
  height: 44px;
  padding: 0 24px;
  background: var(--gradient-gold-soft);
  color: var(--navy-800);
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  white-space: nowrap;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  box-shadow: var(--shadow-raised);
  transition: all var(--transition-fast);
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: var(--shadow-floating); }
.btn-primary:active { transform: translateY(0); box-shadow: var(--shadow-pressed); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

.btn-open {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%;
  height: 48px;
  font-family: var(--font);
  font-weight: 600;
  font-size: 15px;
  background: var(--gradient-navy-deep);
  color: #fff;
  border: none;
  border-radius: var(--radius-lg);
  cursor: pointer;
  text-decoration: none;
  box-shadow: var(--shadow-raised);
  transition: all var(--transition-fast);
}
.btn-open:hover { transform: translateY(-1px); box-shadow: var(--shadow-floating); }
.btn-open:active { transform: translateY(0); }

/* ── Progress ── */
.progress-wrap { height: 4px; background: var(--slate-200); border-radius: 2px; overflow: hidden; margin-top: 14px; display: none; }
.progress-wrap.active { display: block; }
.progress-bar { height: 100%; background: var(--gradient-gold-soft); border-radius: 2px; width: 0%; transition: width 0.4s ease; }

/* ── Log ── */
.log-box {
  background: var(--bg-surface);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-lg);
  padding: 14px 16px;
  max-height: 180px;
  overflow-y: auto;
  font-size: 13px;
  line-height: 2;
  display: none;
}
.log-box.visible { display: block; }
.log-box::-webkit-scrollbar { width: 6px; }
.log-box::-webkit-scrollbar-thumb { background: var(--slate-200); border-radius: 3px; }
.log-entry { display: flex; gap: 12px; }
.log-time { color: var(--text-tertiary); flex-shrink: 0; font-size: 11px; font-family: var(--mono); }
.log-msg { color: var(--text-primary); }
.log-msg.success { color: var(--success-fg); font-weight: 500; }
.log-msg.error   { color: var(--error-fg); font-weight: 500; }
.log-msg.warn    { color: var(--warning-fg); }
.log-msg.muted   { color: var(--text-secondary); }

/* ── Result ── */
.result-section { display: none; }
.result-section.visible { display: flex; flex-direction: column; gap: 16px; }
.stats-row { display: flex; gap: 12px; flex-wrap: wrap; }
.stat {
  flex: 1;
  min-width: 120px;
  background: var(--bg-surface);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-lg);
  padding: 18px 16px;
  text-align: center;
  box-shadow: var(--shadow-raised);
}
.stat-num {
  font-family: var(--font);
  font-size: 30px; font-weight: 600;
  color: var(--navy-800);
  display: block;
  line-height: 1.1;
  letter-spacing: -0.01em;
}
.stat-label {
  font-size: 11px; font-weight: 500;
  color: var(--text-secondary);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-top: 8px;
  display: block;
}
.stat.time .stat-num { color: var(--gold-600); }
.stat.purchased { border-color: var(--teal-200); background: var(--teal-50); }
.stat.purchased .stat-num { color: var(--teal-700); }

/* ── CSV Buttons ── */
.csv-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-csv {
  flex: 1;
  min-width: 150px;
  height: 40px;
  font-family: var(--font);
  font-weight: 500;
  font-size: 13px;
  padding: 0 12px;
  background: transparent;
  color: var(--gold-700);
  border: 1.5px solid var(--gold-400);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: all var(--transition-fast);
}
.btn-csv:hover:not(:disabled) { background: var(--gold-50); }
.btn-csv:disabled { cursor: not-allowed; }
.btn-csv.purchased { color: var(--teal-700); border-color: var(--teal-500); }
.btn-csv.purchased:hover:not(:disabled) { background: var(--teal-50); }

/* ── 已購買名單上傳 ── */
.upload-zone {
  border: 2px dashed var(--border-strong);
  border-radius: var(--radius-lg);
  padding: 24px 20px;
  text-align: center;
  cursor: pointer;
  position: relative;
  background: var(--bg-base);
  transition: all var(--transition-normal);
}
.upload-zone:hover, .upload-zone.drag-over {
  border-color: var(--gold-400);
  background: var(--gold-50);
}
.upload-zone input[type="file"] {
  position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
}
.upload-zone .uz-icon { font-size: 26px; line-height: 1; margin-bottom: 8px; }
.upload-zone .uz-text { font-size: 14px; color: var(--text-primary); font-weight: 500; }
.upload-zone .uz-hint { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

.purchased-badge {
  display: none;
  align-items: center;
  gap: 10px;
  margin-top: 12px;
  padding: 12px 14px;
  background: var(--success-light);
  border: 1px solid #a7f3d0;
  border-radius: var(--radius-lg);
  font-size: 13px;
  color: var(--success-fg);
}
.purchased-badge.visible { display: flex; }
.purchased-badge .dot {
  width: 8px; height: 8px;
  background: var(--success);
  border-radius: 50%;
  flex-shrink: 0;
}
.btn-clear {
  margin-left: auto; flex-shrink: 0;
  font-family: var(--font);
  font-size: 12px; font-weight: 500;
  color: var(--text-secondary);
  background: var(--bg-surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  padding: 4px 10px; cursor: pointer;
  transition: all var(--transition-fast);
}
.btn-clear:hover { border-color: var(--error); color: var(--error); }

/* ── History / Form list rows ── */
.history-list { display: flex; flex-direction: column; gap: 6px; }
.history-item, .form-item {
  background: var(--bg-surface);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: all var(--transition-fast);
}
.history-item:hover, .form-item:hover {
  border-color: var(--gold-200);
  box-shadow: var(--shadow-sm);
}
.history-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px;
  font-size: 13px;
}
.history-id { color: var(--text-primary); font-weight: 500; min-width: 100px; }
.history-date { color: var(--text-tertiary); min-width: 90px; font-family: var(--mono); font-size: 12px; }
.history-counts { color: var(--text-secondary); flex: 1; }
.history-dl {
  color: var(--text-secondary); text-decoration: none; font-size: 12px; font-weight: 500;
  padding: 5px 10px; border: 1px solid var(--border-default);
  border-radius: var(--radius-sm); transition: all var(--transition-fast); white-space: nowrap;
}
.history-dl:hover { border-color: var(--border-strong); background: var(--bg-muted); color: var(--text-primary); }
.history-update-btn {
  font-family: var(--font);
  font-size: 12px; font-weight: 500;
  color: var(--teal-700); background: transparent;
  border: 1px solid var(--teal-200); border-radius: var(--radius-sm);
  padding: 5px 10px; cursor: pointer; transition: all var(--transition-fast);
  white-space: nowrap;
}
.history-update-btn:hover:not(:disabled) { border-color: var(--teal-500); background: var(--teal-50); }
.history-update-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.history-update-btn.loading { opacity: 0.7; cursor: not-allowed; }
.history-empty { color: var(--text-tertiary); font-size: 13px; text-align: center; padding: 24px; }

.form-item {
  display: flex; flex-direction: column; gap: 2px;
  padding: 10px 14px;
}
.form-item.selected {
  border-color: var(--gold-400);
  background: var(--gold-50);
  box-shadow: 0 0 0 3px rgba(251,191,36,0.15);
}
.form-item-title { font-size: 14px; font-weight: 500; color: var(--text-primary); }
.form-item-meta { font-size: 11px; color: var(--text-tertiary); font-family: var(--mono); }

/* ── Spinner ── */
.spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(12,35,64,0.2); border-top-color: var(--navy-800); border-radius: 50%; animation: spin 0.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Responsive ── */
@media (max-width: 600px) {
  header { padding: 0 16px; height: 56px; }
  .brand-symbol { height: 30px; }
  .brand-wordmark { height: 15px; }
  .brand-divider, .brand-product { display: none; }
  main { padding: 20px 16px 48px; gap: 16px; }
  .page-title h1 { font-size: 24px; }
  .card { padding: 20px 16px; }
  .input-wrap { flex-direction: column; }
  .btn-primary { width: 100%; }
  .stats-row { display: grid; grid-template-columns: 1fr 1fr; }
  .stat { min-width: 0; padding: 16px 12px; }
  .stat-num { font-size: 26px; }
  .csv-row { flex-direction: column; }
  .history-item { flex-wrap: wrap; row-gap: 8px; }
  .history-counts { flex-basis: 100%; }
}
</style>
</head>

<main>
  <div class="page-title">
    <div class="eyebrow">Typeform Exporter</div>
    <h1>名單匯出工具</h1>
    <p>貼上 Typeform Form ID，自動整理 email 與電話名單，匯出至 Google Sheet。</p>
  </div>

  <!-- ── 匯出名單 ── -->
  <div class="card">
    <div class="card-title">匯出名單</div>

    <div id="formSelectWrap" style="display:none;">
      <div class="field-row">
        <label class="field-label">近期表單</label>
        <button class="link-btn" onclick="loadForms()">↻ 重新載入</button>
      </div>
      <div id="formList" class="form-list"></div>
      <div id="formListLoading" class="form-list-loading">載入中...</div>
    </div>

    <!-- 分隔線 -->
    <div id="divider" class="divider" style="display:none;"></div>

    <!-- 手動輸入區 -->
    <label class="field-label" for="formId">手動輸入 Form ID</label>
    <div class="input-wrap">
      <input type="text" id="formId" placeholder="例如 kvXJ90jH" autocomplete="off" />
      <button class="btn-primary" id="exportBtn" onclick="startExport()">執行</button>
    </div>

    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </div>

  <!-- Log -->
  <div class="log-box" id="logBox"></div>

  <!-- 結果 -->
  <div class="result-section" id="resultSection">
    <div class="stats-row">
      <div class="stat">
        <span class="stat-num" id="statEmail">—</span>
        <span class="stat-label">Email 筆數</span>
      </div>
      <div class="stat">
        <span class="stat-num" id="statPhone">—</span>
        <span class="stat-label">Phone 筆數</span>
      </div>
      <!-- 已購買統計（有載入名單才顯示）-->
      <div class="stat purchased" id="statPEmailBox" style="display:none;">
        <span class="stat-num" id="statPEmail">—</span>
        <span class="stat-label">已購買 Email</span>
      </div>
      <div class="stat purchased" id="statPPhoneBox" style="display:none;">
        <span class="stat-num" id="statPPhone">—</span>
        <span class="stat-label">已購買 Phone</span>
      </div>
      <div class="stat time">
        <span class="stat-num" id="statTime">—</span>
        <span class="stat-label">執行秒數</span>
      </div>
    </div>

    <!-- CSV 下載按鈕 -->
    <div class="csv-row">
      <button class="btn-csv" id="btnDlEmail" onclick="downloadCSV('email')">✉ 下載 Email CSV</button>
      <button class="btn-csv" id="btnDlPhone" onclick="downloadCSV('phone')">📱 下載 Phone CSV</button>
      <button class="btn-csv purchased" id="btnDlPEmail" onclick="downloadCSV('purchased-email')" style="display:none;">🛒 已購買 Email CSV</button>
      <button class="btn-csv purchased" id="btnDlPPhone" onclick="downloadCSV('purchased-phone')" style="display:none;">🛒 已購買 Phone CSV</button>
    </div>

    <a class="btn-open" id="btnOpenSheet" href="#" target="_blank" style="display:none;">
      ↗ &nbsp;開啟 Google Sheet
    </a>
  </div>

  <!-- ── 已購買名單上傳 ── -->
  <div class="card">
    <div class="card-title">已購買名單 <span class="optional">選填</span></div>
    <div class="upload-zone" id="uploadZone">
      <input type="file" accept=".csv" id="purchasedFile" />
      <div class="uz-icon">📄</div>
      <div class="uz-text" id="uzText">點擊或拖曳已購買名單 CSV</div>
      <div class="uz-hint" id="uzHint">需含「電子信箱」與「聯絡電話」欄位（如 Zeczec 訂單匯出）</div>
    </div>
    <div class="purchased-badge" id="purchasedBadge">
      <div class="dot"></div>
      <span id="purchasedBadgeText">—</span>
      <button class="btn-clear" onclick="clearPurchased()">✕ 清除</button>
    </div>
  </div>

  <!-- 歷史紀錄 -->
  <div class="card">
    <div class="card-title">歷史紀錄</div>
    <div class="history-list" id="historyList">
      <div class="history-empty">尚無歷史紀錄</div>
    </div>
  </div>
</main>

<script>
const HISTORY_KEY = 'mixxin_tf_history';
let currentFormId = '';
const formTitleMap = {};
let _purchasedLoaded = false;
let _purchasedEmailList = [];   // 解析好的 email 陣列，隨 export 請求帶入
let _purchasedPhoneList = [];   // 解析好的 phone 陣列（已 normalize）

/* ── 歷史紀錄 ── */
function loadHistory() { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); }
function saveHistory(r) { localStorage.setItem(HISTORY_KEY, JSON.stringify(r.slice(0, 20))); }
function addHistory(r)  { const h = loadHistory(); h.unshift(r); saveHistory(h); renderHistory(); }

function renderHistory() {
  const list    = document.getElementById('historyList');
  const records = loadHistory();
  if (!records.length) { list.innerHTML = '<div class="history-empty">尚無歷史紀錄</div>'; return; }
  list.innerHTML = records.map((r, idx) => `
    <div class="history-item" onclick="loadFromHistory('${r.form_id}','${r.sheet_url}',${r.email_count},${r.phone_count},${r.elapsed})">
      <span class="history-id">${r.title || r.form_id}</span>
      <span class="history-date">${r.date}</span>
      <span class="history-counts">✉ ${r.email_count} &nbsp;📱 ${r.phone_count}</span>
      <button
        id="upd-btn-${idx}"
        class="history-update-btn"
        ${_purchasedLoaded ? '' : 'disabled'}
        title="${_purchasedLoaded ? '將已購買名單寫入此 Sheet' : '請先上傳已購買名單 CSV'}"
        onclick="event.stopPropagation(); updatePurchasedForHistory('${r.sheet_url}', ${idx})"
      >🔄 更新已購買</button>
      <a class="history-dl" href="${r.sheet_url}" target="_blank" onclick="event.stopPropagation()">Sheets ↗</a>
    </div>
  `).join('');
}

function loadFromHistory(formId, sheetUrl, emailCount, phoneCount, elapsed) {
  currentFormId = formId;
  document.getElementById('formId').value = formId;
  showResult(sheetUrl, emailCount, phoneCount, elapsed, 0, 0, false, true /* fromHistory */);
}

/* ── Log ── */
function log(msg, type = '') {
  const box = document.getElementById('logBox');
  box.classList.add('visible');
  const now = new Date().toTimeString().slice(0, 8);
  const div = document.createElement('div');
  div.className = 'log-entry';
  div.innerHTML = `<span class="log-time">${now}</span><span class="log-msg ${type}">${msg}</span>`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}
function clearLog() { const b = document.getElementById('logBox'); b.innerHTML = ''; b.classList.remove('visible'); }

/* ── Progress ── */
function setProgress(pct) {
  document.getElementById('progressWrap').classList.toggle('active', pct > 0 && pct < 100);
  document.getElementById('progressBar').style.width = pct + '%';
}

/* ── 顯示結果 ── */
function showResult(sheetUrl, emailCount, phoneCount, elapsed, pEmailCount, pPhoneCount, purchasedLoaded, fromHistory) {
  document.getElementById('btnOpenSheet').href = sheetUrl;
  document.getElementById('btnOpenSheet').style.display = 'flex';
  document.getElementById('statEmail').textContent = emailCount;
  document.getElementById('statPhone').textContent = phoneCount;
  document.getElementById('statTime').textContent  = elapsed;

  // 只有本次真的上傳了已購買名單，才顯示已購買區塊
  const hasPurchased = !!purchasedLoaded;
  document.getElementById('statPEmail').textContent    = pEmailCount;
  document.getElementById('statPPhone').textContent    = pPhoneCount;
  document.getElementById('statPEmailBox').style.display = hasPurchased ? '' : 'none';
  document.getElementById('statPPhoneBox').style.display = hasPurchased ? '' : 'none';
  document.getElementById('btnDlPEmail').style.display   = hasPurchased ? '' : 'none';
  document.getElementById('btnDlPPhone').style.display   = hasPurchased ? '' : 'none';

  // 歷史載入時無法下載 CSV（server 重啟後快取已清空），改為提示文字
  const dlEmail = document.getElementById('btnDlEmail');
  const dlPhone = document.getElementById('btnDlPhone');
  if (fromHistory) {
    dlEmail.disabled = true;
    dlPhone.disabled = true;
    dlEmail.title = '請重新執行匯出後即可下載 CSV';
    dlPhone.title = '請重新執行匯出後即可下載 CSV';
    dlEmail.style.opacity = '0.45';
    dlPhone.style.opacity = '0.45';
  } else {
    dlEmail.disabled = false;
    dlPhone.disabled = false;
    dlEmail.title = '';
    dlPhone.title = '';
    dlEmail.style.opacity = '';
    dlPhone.style.opacity = '';
  }

  document.getElementById('resultSection').classList.add('visible');
}

/* ── 已購買名單上傳 ── */
async function handlePurchasedUpload(file) {
  if (!file || !file.name.toLowerCase().endsWith('.csv')) {
    log('⚠ 請選擇 .csv 檔案', 'warn'); return;
  }
  document.getElementById('uzText').textContent = '上傳中…';
  document.getElementById('uzHint').textContent = '';

  const form = new FormData();
  form.append('file', file);

  try {
    const res  = await fetch('/upload-purchased', { method: 'POST', body: form });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || '上傳失敗');

    document.getElementById('uzText').textContent = '✅ ' + file.name;
    document.getElementById('uzHint').textContent = `${data.email_count} 封 email・${data.phone_count} 支電話`;

    const badge = document.getElementById('purchasedBadge');
    badge.classList.add('visible');
    document.getElementById('purchasedBadgeText').innerHTML =
      `已載入已購買名單：<strong>${data.email_count}</strong> 封 email、<strong>${data.phone_count}</strong> 支電話（Phone 匯出將自動排除這些號碼）`;

    log(`✔ 已購買名單載入：${data.email_count} email / ${data.phone_count} 電話`, 'success');

    // 把解析好的名單存在前端，隨 export 請求一起帶入（避免伺服器記憶體遺失問題）
    _purchasedEmailList = data.email_list || [];
    _purchasedPhoneList = data.phone_list || [];
    _purchasedLoaded = true;
    renderHistory(); // 重新渲染讓按鈕從灰色變為可點擊
  } catch (err) {
    document.getElementById('uzText').textContent = '點擊或拖曳已購買名單 CSV';
    document.getElementById('uzHint').textContent = '需含「電子信箱」與「聯絡電話」欄位（如 Zeczec 訂單匯出）';
    log(`✕ 已購買名單上傳失敗：${err.message}`, 'error');
  }
}

/* ── 清除已購買名單 ── */
function clearPurchased() {
  _purchasedLoaded    = false;
  _purchasedEmailList = [];
  _purchasedPhoneList = [];

  // 還原上傳區 UI
  document.getElementById('uzText').textContent = '點擊或拖曳已購買名單 CSV';
  document.getElementById('uzHint').textContent = '需含「電子信箱」與「聯絡電話」欄位（如 Zeczec 訂單匯出）';
  document.getElementById('purchasedFile').value = '';   // 清掉 file input，讓同一個檔案可以重新選
  document.getElementById('purchasedBadge').classList.remove('visible');

  renderHistory(); // 讓「更新已購買」按鈕回到灰色
  log('已清除已購買名單', 'muted');
}

document.getElementById('purchasedFile').addEventListener('change', e => {
  if (e.target.files[0]) handlePurchasedUpload(e.target.files[0]);
});
const uploadZone = document.getElementById('uploadZone');
uploadZone.addEventListener('dragover',  e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('drag-over');
  if (e.dataTransfer.files[0]) handlePurchasedUpload(e.dataTransfer.files[0]);
});

/* ── 匯出 ── */
async function startExport() {
  const formId = document.getElementById('formId').value.trim();
  if (!formId) { log('⚠ 請輸入 Form ID', 'warn'); return; }

  currentFormId = formId;
  const btn = document.getElementById('exportBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> 執行中';
  document.getElementById('resultSection').classList.remove('visible');
  clearLog();
  log(`▶ 開始匯出：${formTitleMap[formId] || formId}`);
  setProgress(10);

  let fakePct = 10;
  const timer = setInterval(() => {
    fakePct = Math.min(fakePct + Math.random() * 7, 88);
    setProgress(fakePct);
  }, 1400);

  try {
    log('📥 連線中...');
    const res = await fetch('/export', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        form_id:          formId,
        has_purchased:    _purchasedLoaded,
        purchased_emails: _purchasedLoaded ? _purchasedEmailList : [],
        purchased_phones: _purchasedLoaded ? _purchasedPhoneList : [],
      }),
    });
    clearInterval(timer);

    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: res.statusText }));
      log(`✕ 錯誤 ${res.status}：${err.detail || '未知錯誤'}`, 'error');
      setProgress(0); return;
    }

    const data = await res.json();
    setProgress(100);
    setTimeout(() => setProgress(0), 600);

    const pEmail = data.purchased_email_count ?? 0;
    const pPhone = data.purchased_phone_count ?? 0;

    log(`✔ 完成！Email ${data.email_count} 筆，Phone ${data.phone_count} 筆`, 'success');
    if (pEmail || pPhone) {
      log(`🛒 已購買名單：Email ${pEmail} 筆，Phone ${pPhone} 筆`, 'muted');
    }
    log(`⏱ 耗時 ${data.elapsed_seconds} 秒`, 'muted');

    showResult(data.sheet_url, data.email_count, data.phone_count, data.elapsed_seconds, pEmail, pPhone, data.purchased_loaded ?? false, false /* fromHistory */);

    // 匯出完成後同步重置前端已購買狀態（server 端亦已用完此筆資料）
    _purchasedLoaded    = false;
    _purchasedEmailList = [];
    _purchasedPhoneList = [];
    renderHistory(); // 讓歷史列表的「更新已購買」按鈕回到灰色

    addHistory({
      form_id:     data.form_id,
      title:       formTitleMap[data.form_id] || data.form_title || data.form_id,
      date:        new Date().toLocaleString('zh-TW', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }),
      email_count: data.email_count,
      phone_count: data.phone_count,
      elapsed:     data.elapsed_seconds,
      sheet_url:   data.sheet_url,
    });

  } catch (e) {
    clearInterval(timer); setProgress(0);
    log(`✕ 無法連線：${e.message}`, 'error');
  } finally {
    btn.disabled = false; btn.innerHTML = '執行';
  }
}

/* ── 更新既有 Sheet 的已購買分頁 ── */
async function updatePurchasedForHistory(sheetUrl, idx) {
  // 從 sheet URL 取出 spreadsheet_id
  const match = sheetUrl.match(/spreadsheets\/d\/([a-zA-Z0-9_-]+)/);
  if (!match) { log('✕ 無法解析 Sheet URL', 'error'); return; }
  const spreadsheetId = match[1];

  const btn = document.getElementById(`upd-btn-${idx}`);
  if (btn) { btn.disabled = true; btn.classList.add('loading'); btn.textContent = '更新中…'; }

  try {
    const res = await fetch('/update-purchased-sheets', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        spreadsheet_id:   spreadsheetId,
        purchased_emails: _purchasedEmailList,   // 帶入前端存的名單，避免伺服器記憶體遺失
        purchased_phones: _purchasedPhoneList,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || '更新失敗');

    log(`✔ 已購買分頁更新完成：Email ${data.purchased_email_count} 筆，Phone ${data.purchased_phone_count} 筆`, 'success');
    if (btn) { btn.textContent = '✅ 已更新'; }
  } catch (err) {
    log(`✕ 更新失敗：${err.message}`, 'error');
    if (btn) { btn.disabled = false; btn.classList.remove('loading'); btn.textContent = '🔄 更新已購買'; }
  }
}

/* ── CSV 下載 ── */
function downloadCSV(type) {
  if (!currentFormId) return;
  const endpoint = type.startsWith('purchased')
    ? `/download/${type}?form_id=${currentFormId}`
    : `/download/${type}?form_id=${currentFormId}`;

  fetch(endpoint)
    .then(res => {
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const disposition = res.headers.get('Content-Disposition') || '';
      const match = disposition.match(/filename\*?=(?:UTF-8'')?(.+)/i);
      const filename = match ? decodeURIComponent(match[1]) : `TF_${type}_${currentFormId}.csv`;
      return res.blob().then(blob => ({ blob, filename }));
    })
    .then(({ blob, filename }) => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      URL.revokeObjectURL(a.href);
      const label = {
        'email':           'Email',
        'phone':           'Phone',
        'purchased-email': '已購買 Email',
        'purchased-phone': '已購買 Phone',
      }[type] || type;
      log(`✔ ${label} CSV 下載完成`, 'success');
    })
    .catch(e => log(`✕ 下載失敗：${e.message}`, 'error'));
}

document.getElementById('formId').addEventListener('keydown', e => {
  if (e.key === 'Enter') startExport();
});

renderHistory();

// 每次開啟頁面都需要重新上傳已購買名單（不使用伺服器暫存，避免多人共用時互相影響）

async function loadForms() {
  document.getElementById('formSelectWrap').style.display = 'block';
  document.getElementById('divider').style.display = 'block';
  document.getElementById('formListLoading').style.display = 'block';
  document.getElementById('formList').innerHTML = '';

  try {
    const res = await fetch('/forms');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    document.getElementById('formListLoading').style.display = 'none';

    if (!data.forms.length) {
      document.getElementById('formList').innerHTML =
        '<div style="font-size:12px;color:var(--muted);padding:8px 0;">沒有找到表單</div>';
      return;
    }

    data.forms.forEach(f => { formTitleMap[f.id] = f.title; });
    document.getElementById('formList').innerHTML = data.forms.map(f => {
      const date = f.last_updated_at
        ? new Date(f.last_updated_at).toLocaleDateString('zh-TW', { month: '2-digit', day: '2-digit' })
        : '';
      return `<div class="form-item" onclick="selectForm('${f.id}', this)">
        <span class="form-item-title">${f.title}</span>
        <span class="form-item-meta">${f.id}${date ? ' · ' + date : ''}</span>
      </div>`;
    }).join('');

  } catch(e) {
    document.getElementById('formListLoading').style.display = 'none';
    document.getElementById('formList').innerHTML =
      `<div style="font-size:12px;color:var(--muted);padding:8px 0;">無法載入表單列表</div>`;
  }
}

function selectForm(formId, el) {
  document.getElementById('formId').value = formId;
  document.querySelectorAll('.form-item').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
}
